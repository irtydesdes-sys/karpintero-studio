<!DOCTYPE html>
<html class="dark" lang="es"><head><meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>body{background:#101418;color:#e0e3e8;font-family:Inter,sans-serif;}</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-40 bg-[#101418]/90 backdrop-blur-xl border-b border-white/5 px-4 h-14 flex items-center justify-between">
  <a href="despiece_detallado_de_cajones.html" class="text-amber-400 text-sm font-bold">← Volver</a>
  <h1 class="text-sm font-bold">Presupuesto (Real)</h1>
  <span></span>
</header>
<main class="p-4 max-w-2xl mx-auto pb-20">

<div class="bg-[#1c2024] border border-white/10 rounded-xl p-4 mb-4">
  <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-3">Presupuesto real del proyecto activo</h2>
  <div id="pr-resumen" class="text-xs text-stone-300 mb-3"></div>
  <div class="grid grid-cols-2 gap-2 text-xs">
    <label class="flex flex-col gap-1">Precio por tablero<input id="pr-precio-tablero" type="number" value="0" class="bg-black/30 rounded px-2 py-2"/></label>
    <label class="flex flex-col gap-1">Horas de banco<input id="pr-horas" type="number" value="0" class="bg-black/30 rounded px-2 py-2"/></label>
    <label class="flex flex-col gap-1">Tarifa por hora<input id="pr-tarifa" type="number" value="0" class="bg-black/30 rounded px-2 py-2"/></label>
    <label class="flex flex-col gap-1">Herrajes / extras<input id="pr-herrajes" type="number" value="0" class="bg-black/30 rounded px-2 py-2"/></label>
  </div>
  <button id="pr-calcular" class="w-full mt-3 py-2.5 rounded bg-amber-500 text-black font-bold text-sm">Calcular presupuesto real</button>
</div>
<div id="pr-resultado"></div>

</main>
<script src="../core/store.js"></script>
<script>
(function(){
  function resumen(){
    var piezas = window.KarpinteroDB.listPiezas();
    var pres = window.KarpinteroDB.getPresupuesto();
    var txt = piezas.length + ' pieza(s) reales en el proyecto activo.';
    if (pres && pres.tablerosCalculados) txt += ' Última optimización real: ' + pres.tablerosCalculados + ' tablero(s).';
    document.getElementById('pr-resumen').textContent = txt;
    if (pres) {
      if (pres.precioTablero != null) document.getElementById('pr-precio-tablero').value = pres.precioTablero;
      if (pres.horas != null) document.getElementById('pr-horas').value = pres.horas;
      if (pres.tarifa != null) document.getElementById('pr-tarifa').value = pres.tarifa;
      if (pres.herrajes != null) document.getElementById('pr-herrajes').value = pres.herrajes;
    }
  }
  document.getElementById('pr-calcular').addEventListener('click', function(){
    var precioTablero = parseFloat(document.getElementById('pr-precio-tablero').value) || 0;
    var horas = parseFloat(document.getElementById('pr-horas').value) || 0;
    var tarifa = parseFloat(document.getElementById('pr-tarifa').value) || 0;
    var herrajes = parseFloat(document.getElementById('pr-herrajes').value) || 0;
    var pres = window.KarpinteroDB.getPresupuesto() || {};
    var tableros = pres.tablerosCalculados || 0;
    var costoTableros = tableros * precioTablero;
    var costoManoObra = horas * tarifa;
    var total = costoTableros + costoManoObra + herrajes;
    window.KarpinteroDB.setPresupuesto(Object.assign({}, pres, {precioTablero: precioTablero, horas: horas, tarifa: tarifa, herrajes: herrajes, total: total}));
    document.getElementById('pr-resultado').innerHTML =
      '<div class="bg-[#1c2024] border border-white/10 rounded-xl p-4 text-xs space-y-1">' +
      '<div class="flex justify-between"><span>Tableros ('+tableros+' × precio)</span><span>'+costoTableros.toFixed(2)+'</span></div>' +
      '<div class="flex justify-between"><span>Mano de obra ('+horas+'h × tarifa)</span><span>'+costoManoObra.toFixed(2)+'</span></div>' +
      '<div class="flex justify-between"><span>Herrajes / extras</span><span>'+herrajes.toFixed(2)+'</span></div>' +
      '<div class="flex justify-between font-bold text-amber-400 pt-2 border-t border-white/10"><span>TOTAL</span><span>'+total.toFixed(2)+'</span></div>' +
      '</div>';
  });
  resumen();
})();
</script>
</body></html>
